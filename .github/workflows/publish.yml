name: Publish Linux packages

on:
  repository_dispatch:
    types: [packages-published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft package release tag in the product repository
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-linux-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Determine release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ github.event.client_payload.release_tag }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            tag=$DISPATCH_TAG
          else
            tag=$INPUT_TAG
          fi
          if ! printf '%s' "$tag" | grep -Eq '^(v?|libvtex-v)[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag must be a semantic version or libvtex-vMAJOR.MINOR.BUILD."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes createrepo-c dpkg-dev dpkg-sig gnupg rpm
      - name: Download draft release packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/incoming"
          gh release download "$RELEASE_TAG" \
            --pattern '*.deb' \
            --pattern '*.rpm' \
            --pattern '*.tar.gz' \
            --dir "$RUNNER_TEMP/incoming"
      - name: Sign packages and publish repository metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VTI_PACKAGE_SIGNING_KEY: ${{ secrets.VTI_PACKAGE_SIGNING_KEY }}
          VTI_PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.VTI_PACKAGE_SIGNING_PASSPHRASE }}
        run: |
          bash scripts/publish-release.sh \
            '${{ steps.release.outputs.tag }}' \
            "$RUNNER_TEMP/incoming" \
            "$RUNNER_TEMP/pages"
